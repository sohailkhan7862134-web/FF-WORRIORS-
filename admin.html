<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biharideluxbhaiya Admin</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#101114;
  color:white;
}

.header{
  padding:20px;
  background:#17191f;
  border-bottom:1px solid #292c33;
}

.header h1{
  font-size:22px;
}

.header p{
  color:#aaa;
  margin-top:5px;
}

.container{
  padding:18px;
  max-width:900px;
  margin:auto;
}

.card{
  background:#191c22;
  border:1px solid #292c33;
  border-radius:15px;
  padding:18px;
  margin-bottom:16px;
}

.card h2{
  font-size:18px;
  margin-bottom:15px;
}

input,select,textarea{
  width:100%;
  padding:13px;
  margin:7px 0 12px;
  background:#101114;
  color:white;
  border:1px solid #343841;
  border-radius:9px;
  outline:none;
}

button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:9px;
  background:#ff6b00;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

.small-btn{
  width:auto;
  padding:10px 16px;
  margin-top:8px;
}

.preview{
  max-width:220px;
  max-height:220px;
  display:none;
  margin:10px auto;
  border-radius:10px;
}

.status{
  margin-top:10px;
  color:#7CFF8A;
}

.tournament{
  padding:14px;
  background:#101114;
  border-radius:10px;
  margin-top:10px;
}

.tournament strong{
  display:block;
  font-size:17px;
  margin-bottom:6px;
}

.instagram{
  text-align:center;
}

.instagram a{
  color:#ff6b00;
  text-decoration:none;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="header">
  <h1>🎮 Biharideluxbhaiya</h1>
  <p>Free Fire Tournament — Admin Panel</p>
</div>

<div class="container">

  <!-- Tournament -->
  <div class="card">
    <h2>➕ Add Tournament</h2>

    <input id="tName" placeholder="Tournament name">

    <select id="tMode">
      <option value="1v1">1v1</option>
      <option value="2v2">2v2</option>
      <option value="Squad">Squad</option>
    </select>

    <input id="entry" type="number" placeholder="Entry fee ₹">

    <input id="prize" type="number" placeholder="Winning prize ₹">

    <input id="date" type="date">

    <input id="time" type="time">

    <button onclick="addTournament()">Add Tournament</button>

    <div id="tStatus" class="status"></div>
  </div>


  <!-- Tournament List -->
  <div class="card">
    <h2>🏆 Tournaments</h2>
    <div id="tournamentList">
      No tournaments added yet.
    </div>
  </div>


  <!-- QR Code -->
  <div class="card">
    <h2>💳 Payment QR Code</h2>

    <input type="file" id="qrInput" accept="image/*">

    <img id="qrPreview" class="preview">

    <button onclick="saveQR()">Save QR Code</button>

    <div id="qrStatus" class="status"></div>
  </div>


  <!-- Instagram -->
  <div class="card instagram">
    <h2>📸 Instagram</h2>

    <a href="https://www.instagram.com/exotic_sohail_782"
       target="_blank">
       @exotic_sohail_782
    </a>
  </div>


  <!-- Rules -->
  <div class="card">
    <h2>📢 Tournament Rules</h2>

    <textarea id="rules" rows="6"
      placeholder="Enter tournament rules"></textarea>

    <button onclick="saveRules()">Save Rules</button>

    <div id="ruleStatus" class="status"></div>
  </div>

</div>


<script>

let tournaments =
JSON.parse(localStorage.getItem("tournaments")) || [];


/* ADD TOURNAMENT */

function addTournament(){

  const name =
  document.getElementById("tName").value.trim();

  const mode =
  document.getElementById("tMode").value;

  const entry =
  document.getElementById("entry").value;

  const prize =
  document.getElementById("prize").value;

  const date =
  document.getElementById("date").value;

  const time =
  document.getElementById("time").value;


  if(!name || !entry || !prize){

    alert("Tournament name, entry fee aur prize bharo.");

    return;
  }


  const tournament = {

    id:Date.now(),

    name:name,

    mode:mode,

    entry:entry,

    prize:prize,

    date:date,

    time:time

  };


  tournaments.push(tournament);

  localStorage.setItem(
    "tournaments",
    JSON.stringify(tournaments)
  );


  document.getElementById("tStatus").innerText =
  "✅ Tournament added successfully!";


  document.getElementById("tName").value="";
  document.getElementById("entry").value="";
  document.getElementById("prize").value="";
  document.getElementById("date").value="";
  document.getElementById("time").value="";


  showTournaments();
}


/* SHOW TOURNAMENTS */

function showTournaments(){

  const box =
  document.getElementById("tournamentList");


  if(tournaments.length===0){

    box.innerHTML="No tournaments added yet.";

    return;
  }


  box.innerHTML="";


  tournaments.forEach(t=>{

    const div =
    document.createElement("div");

    div.className="tournament";


    div.innerHTML=`

      <strong>${t.name}</strong>

      Mode: ${t.mode}<br>

      Entry: ₹${t.entry}<br>

      Prize: ₹${t.prize}<br>

      Date: ${t.date || "Not set"}<br>

      Time: ${t.time || "Not set"}

      <br>

      <button
      class="small-btn"
      onclick="deleteTournament(${t.id})">
      Delete
      </button>

    `;


    box.appendChild(div);

  });

}


/* DELETE */

function deleteTournament(id){

  if(!confirm("Tournament delete karna hai?"))
  return;


  tournaments =
  tournaments.filter(t=>t.id!==id);


  localStorage.setItem(
    "tournaments",
    JSON.stringify(tournaments)
  );


  showTournaments();
}


/* QR PREVIEW */

document
.getElementById("qrInput")
.addEventListener("change",function(){

  const file=this.files[0];

  if(!file)return;


  const reader=new FileReader();


  reader.onload=function(e){

    const img =
    document.getElementById("qrPreview");

    img.src=e.target.result;

    img.style.display="block";

  };


  reader.readAsDataURL(file);

});


/* SAVE QR */

function saveQR(){

  const img =
  document.getElementById("qrPreview");


  if(!img.src){

    alert("Pehle QR image select karo.");

    return;
  }


  localStorage.setItem(
    "paymentQR",
    img.src
  );


  document.getElementById("qrStatus").innerText =
  "✅ QR Code saved!";
}


/* RULES */

function saveRules(){

  const rules =
  document.getElementById("rules").value;


  localStorage.setItem(
    "rules",
    rules
  );


  document.getElementById("ruleStatus").innerText =
  "✅ Rules saved!";
}


/* LOAD DATA */

window.onload=function(){

  showTournaments();


  const savedQR =
  localStorage.getItem("paymentQR");


  if(savedQR){

    const img =
    document.getElementById("qrPreview");

    img.src=savedQR;

    img.style.display="block";

  }


  const savedRules =
  localStorage.getItem("rules");


  if(savedRules){

    document.getElementById("rules").value =
    savedRules;

  }

};

</script>

</body>
  </html>
