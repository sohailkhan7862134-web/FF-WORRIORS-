<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FF WARRIORS - Admin Panel</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#080b12;
  color:#fff;
}

header{
  background:#111827;
  padding:18px;
  text-align:center;
  border-bottom:1px solid #263044;
  position:sticky;
  top:0;
  z-index:10;
}

header h1{
  color:#00d9ff;
  font-size:24px;
}

header p{
  color:#9ca3af;
  font-size:13px;
  margin-top:5px;
}

.container{
  max-width:600px;
  margin:auto;
  padding:15px;
}

.card{
  background:#111827;
  border:1px solid #263044;
  border-radius:15px;
  padding:18px;
  margin-bottom:15px;
}

.card h2{
  font-size:18px;
  margin-bottom:15px;
  color:#00d9ff;
}

label{
  display:block;
  margin-top:13px;
  margin-bottom:6px;
  color:#cbd5e1;
  font-size:14px;
}

input,textarea,select{
  width:100%;
  padding:13px;
  background:#1f2937;
  border:1px solid #374151;
  border-radius:9px;
  color:white;
  outline:none;
  font-size:15px;
}

textarea{
  resize:vertical;
  min-height:90px;
}

input:focus,textarea:focus,select:focus{
  border-color:#00d9ff;
}

button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:0;
  border-radius:9px;
  color:white;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
}

.save{
  background:#00a86b;
}

.reset{
  background:#374151;
}

.logout{
  background:#dc2626;
}

.status{
  text-align:center;
  padding:10px;
  color:#22c55e;
  font-weight:bold;
  min-height:20px;
}

.qr-box{
  text-align:center;
  background:#fff;
  border-radius:12px;
  padding:12px;
  margin-top:12px;
}

.qr-box img{
  width:220px;
  max-width:100%;
  display:block;
  margin:auto;
}

.preview{
  background:#0f172a;
  border-radius:12px;
  padding:15px;
  margin-top:10px;
}

.preview-title{
  font-size:20px;
  font-weight:bold;
  color:#00d9ff;
}

.preview-row{
  display:flex;
  justify-content:space-between;
  margin-top:10px;
  padding:10px;
  background:#1e293b;
  border-radius:8px;
}

.hidden{
  display:none;
}

.switch{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#1f2937;
  padding:12px;
  border-radius:9px;
  margin-top:10px;
}

.switch input{
  width:22px;
  height:22px;
}
</style>
</head>

<body>

<header>
  <h1>⚡ FF WARRIORS</h1>
  <p>ADMIN CONTROL PANEL</p>
</header>

<div class="container">

  <!-- TOURNAMENT -->
  <div class="card">

    <h2>🏆 Tournament Settings</h2>

    <label>Tournament Name</label>
    <input id="tournamentName" placeholder="Example: FF Warriors Night Cup">

    <label>Game Mode</label>
    <select id="mode">
      <option>1v1</option>
      <option>2v2</option>
      <option>Squad</option>
      <option>Custom</option>
    </select>

    <label>Entry Fee ₹</label>
    <input id="entryFee" type="number" placeholder="20">

    <label>Winner Prize ₹</label>
    <input id="prize" type="number" placeholder="40">

    <label>Tournament Date</label>
    <input id="date" type="date">

    <label>Tournament Time</label>
    <input id="time" type="time">

    <label>Host Name</label>
    <input id="host" placeholder="biharideluxbhaiya">

  </div>


  <!-- QR -->
  <div class="card">

    <h2>📸 Payment QR</h2>

    <label>Upload New QR</label>

    <input
      type="file"
      id="qrUpload"
      accept="image/*"
    >

    <div id="qrBox" class="qr-box hidden">
      <img id="qrImage">
    </div>

  </div>


  <!-- NOTICE -->
  <div class="card">

    <h2>📢 Notice / Announcement</h2>

    <textarea
      id="notice"
      placeholder="Example: Room ID & Password match se 10 minute pahle milega."
    ></textarea>

  </div>


  <!-- RULES -->
  <div class="card">

    <h2>📜 Tournament Rules</h2>

    <textarea
      id="rules"
      placeholder="Tournament rules yahan likho..."
    ></textarea>

  </div>


  <!-- STATUS -->
  <div class="card">

    <h2>⚙️ Tournament Status</h2>

    <div class="switch">
      <span>Tournament Active</span>
      <input type="checkbox" id="active">
    </div>

    <div class="switch">
      <span>Registration Open</span>
      <input type="checkbox" id="registration">
    </div>

  </div>


  <!-- PREVIEW -->
  <div class="card">

    <h2>👀 Live Preview</h2>

    <div class="preview">

      <div
        class="preview-title"
        id="previewName"
      >
        Tournament Name
      </div>

      <div class="preview-row">
        <span>Mode</span>
        <b id="previewMode">1v1</b>
      </div>

      <div class="preview-row">
        <span>Entry</span>
        <b>₹<span id="previewEntry">0</span></b>
      </div>

      <div class="preview-row">
        <span>Prize</span>
        <b>₹<span id="previewPrize">0</span></b>
      </div>

      <div class="preview-row">
        <span>Date</span>
        <b id="previewDate">-</b>
      </div>

      <div class="preview-row">
        <span>Host</span>
        <b id="previewHost">-</b>
      </div>

    </div>

  </div>


  <!-- SAVE -->
  <div class="card">

    <button class="save" onclick="saveSettings()">
      💾 SAVE ALL SETTINGS
    </button>

    <button class="reset" onclick="loadSettings()">
      🔄 LOAD SAVED SETTINGS
    </button>

    <button class="logout" onclick="logout()">
      🚪 LOGOUT
    </button>

    <div id="status" class="status"></div>

  </div>

</div>


<script>

/* =========================
   ADMIN LOGIN
========================= */

const ADMIN_USER = "admin";
const ADMIN_PASS = "12345";

if(localStorage.getItem("adminLogin") !== "yes"){

  const user = prompt("Admin Username");

  const pass = prompt("Admin Password");

  if(user !== ADMIN_USER || pass !== ADMIN_PASS){

    document.body.innerHTML = `
      <div style="
        color:white;
        text-align:center;
        padding:50px;
        font-family:Arial;
        background:#080b12;
        min-height:100vh;
      ">
        <h1>❌ Access Denied</h1>
        <p>Wrong admin login.</p>
      </div>
    `;

    throw new Error("Unauthorized");
  }

  localStorage.setItem("adminLogin","yes");
}


/* =========================
   QR UPLOAD
========================= */

document
.getElementById("qrUpload")
.addEventListener("change",function(e){

  const file = e.target.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(){

    localStorage.setItem(
      "tournamentQR",
      reader.result
    );

    showQR(reader.result);
  };

  reader.readAsDataURL(file);
});


function showQR(src){

  const box =
    document.getElementById("qrBox");

  const image =
    document.getElementById("qrImage");

  image.src = src;

  box.classList.remove("hidden");
}


/* =========================
   LIVE PREVIEW
========================= */

function updatePreview(){

  document.getElementById("previewName").innerText =
    document.getElementById("tournamentName").value
    || "Tournament Name";

  document.getElementById("previewMode").innerText =
    document.getElementById("mode").value;

  document.getElementById("previewEntry").innerText =
    document.getElementById("entryFee").value
    || "0";

  document.getElementById("previewPrize").innerText =
    document.getElementById("prize").value
    || "0";

  document.getElementById("previewDate").innerText =
    document.getElementById("date").value
    || "-";

  document.getElementById("previewHost").innerText =
    document.getElementById("host").value
    || "-";
}


document.querySelectorAll(
  "input,textarea,select"
).forEach(function(el){

  el.addEventListener(
    "input",
    updatePreview
  );

  el.addEventListener(
    "change",
    updatePreview
  );

});


/* =========================
   SAVE ALL
========================= */

function saveSettings(){

  const settings = {

    tournamentName:
      document.getElementById("tournamentName").value,

    mode:
      document.getElementById("mode").value,

    entryFee:
      document.getElementById("entryFee").value,

    prize:
      document.getElementById("prize").value,

    date:
      document.getElementById("date").value,

    time:
      document.getElementById("time").value,

    host:
      document.getElementById("host").value,

    notice:
      document.getElementById("notice").value,

    rules:
      document.getElementById("rules").value,

    active:
      document.getElementById("active").checked,

    registration:
      document.getElementById("registration").checked
  };


  localStorage.setItem(
    "tournamentSettings",
    JSON.stringify(settings)
  );


  document.getElementById("status").innerText =
    "✅ All settings saved successfully!";

}


/* =========================
   LOAD SETTINGS
========================= */

function loadSettings(){

  const saved =
    localStorage.getItem(
      "tournamentSettings"
    );

  if(saved){

    const s = JSON.parse(saved);

    document.getElementById("tournamentName").value =
      s.tournamentName || "";

    document.getElementById("mode").value =
      s.mode || "1v1";

    document.getElementById("entryFee").value =
      s.entryFee || "";

    document.getElementById("prize").value =
      s.prize || "";

    document.getElementById("date").value =
      s.date || "";

    document.getElementById("time").value =
      s.time || "";

    document.getElementById("host").value =
      s.host || "";

    document.getElementById("notice").value =
      s.notice || "";

    document.getElementById("rules").value =
      s.rules || "";

    document.getElementById("active").checked =
      s.active || false;

    document.getElementById("registration").checked =
      s.registration || false;

    updatePreview();
  }


  const qr =
    localStorage.getItem("tournamentQR");

  if(qr){
    showQR(qr);
  }

}


/* =========================
   LOGOUT
========================= */

function logout(){

  localStorage.removeItem("adminLogin");

  location.reload();

}


/* Load on startup */
loadSettings();
updatePreview();

</script>

</body>
  </html>
