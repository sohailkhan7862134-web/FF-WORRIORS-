<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FF-WORRIORS Admin Panel</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b0b0f;
  color:#fff;
}
.login{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}
.login-box{
  width:100%;
  max-width:380px;
  background:#15151d;
  padding:30px;
  border-radius:18px;
  text-align:center;
}
.login-box h1{margin-bottom:8px}
.login-box p{color:#aaa}
input,select,button,textarea{
  width:100%;
  padding:13px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  font-size:15px;
}
input,select,textarea{
  background:#242430;
  color:#fff;
}
button{
  background:#ff7a00;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}
.error{
  color:#ff4d4d;
  margin-top:12px;
  display:none;
}

.panel{display:none}
header{
  background:#15151d;
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
}
header h2{margin:0}
.logout{
  width:auto;
  padding:9px 15px;
  margin:0;
  background:#d33;
}
.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}
.card{
  background:#15151d;
  padding:20px;
  border-radius:16px;
  margin-bottom:18px;
}
.card h3{margin-top:0}
.row{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
}
.save{
  background:#16a34a;
}
.delete{
  background:#dc2626;
}
.preview{
  max-width:220px;
  max-height:220px;
  margin-top:12px;
  border-radius:12px;
  display:none;
}
.status{
  margin-top:10px;
  color:#65e572;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="loginPage">
  <div class="login-box">
    <h1>🎮 FF-WORRIORS</h1>
    <p>Admin Panel Login</p>

    <input
      type="password"
      id="password"
      placeholder="Enter Admin Password"
      autocomplete="off"
    >

    <button onclick="login()">LOGIN</button>

    <div class="error" id="error">
      Wrong password!
    </div>
  </div>
</div>


<!-- ADMIN PANEL -->
<div class="panel" id="adminPanel">

<header>
  <h2>⚡ Admin Panel</h2>
  <button class="logout" onclick="logout()">Logout</button>
</header>

<div class="container">

  <!-- QR CODE -->
  <div class="card">
    <h3>💳 Payment QR Code</h3>

    <input type="file" id="qrFile" accept="image/*">

    <img id="qrPreview" class="preview">

    <button onclick="saveQR()" class="save">
      Save QR Code
    </button>

    <div id="qrStatus" class="status"></div>
  </div>


  <!-- TOURNAMENT SETTINGS -->
  <div class="card">
    <h3>🏆 Tournament Settings</h3>

    <div class="row">

      <div>
        <label>1v1 Entry Fee</label>
        <input type="number" id="oneEntry" value="20">
      </div>

      <div>
        <label>1v1 Winner Prize</label>
        <input type="number" id="onePrize" value="40">
      </div>

      <div>
        <label>2v2 Entry Fee</label>
        <input type="number" id="twoEntry" value="40">
      </div>

      <div>
        <label>2v2 Winner Prize</label>
        <input type="number" id="twoPrize" value="70">
      </div>

      <div>
        <label>Squad Entry Per Person</label>
        <input type="number" id="squadEntry" value="40">
      </div>

      <div>
        <label>Squad Winner Prize</label>
        <input type="number" id="squadPrize" value="250">
      </div>

    </div>

    <button class="save" onclick="saveTournament()">
      Save Tournament Settings
    </button>

    <div id="tournamentStatus" class="status"></div>
  </div>


  <!-- NOTICE -->
  <div class="card">
    <h3>📢 Notice / Announcement</h3>

    <textarea
      id="notice"
      rows="4"
      placeholder="Write your tournament announcement..."
    ></textarea>

    <button class="save" onclick="saveNotice()">
      Save Notice
    </button>

    <div id="noticeStatus" class="status"></div>
  </div>


  <!-- CONTACT -->
  <div class="card">
    <h3>📱 Contact Links</h3>

    <input
      type="text"
      id="whatsapp"
      placeholder="WhatsApp link"
    >

    <input
      type="text"
      id="telegram"
      placeholder="Telegram link"
    >

    <button class="save" onclick="saveContacts()">
      Save Contact Links
    </button>

    <div id="contactStatus" class="status"></div>
  </div>


  <!-- PLAYER REGISTRATION -->
  <div class="card">
    <h3>👥 Player Registration</h3>

    <div class="row">

      <input id="playerName" placeholder="Player Name">

      <input id="playerUid" placeholder="Free Fire UID">

      <select id="playerMode">
        <option value="1v1">1v1</option>
        <option value="2v2">2v2</option>
        <option value="Squad">Squad</option>
      </select>

    </div>

    <button onclick="addPlayer()">
      Add Player
    </button>

    <div id="players"></div>
  </div>


  <!-- RESULTS -->
  <div class="card">
    <h3>🏅 Winner / Result</h3>

    <input
      id="winner"
      placeholder="Winner name / UID"
    >

    <button class="save" onclick="saveWinner()">
      Publish Winner
    </button>

    <div id="winnerStatus" class="status"></div>
  </div>

</div>
</div>


<script>

const ADMIN_PASSWORD = "Sohailkhan78654";


function login(){

  const entered =
    document.getElementById("password").value;

  if(entered === ADMIN_PASSWORD){

    document.getElementById("loginPage").style.display="none";
    document.getElementById("adminPanel").style.display="block";

    loadData();

  }else{

    document.getElementById("error").style.display="block";

  }
}


document.getElementById("password")
.addEventListener("keydown",function(e){

  if(e.key === "Enter"){
    login();
  }

});


function logout(){

  document.getElementById("adminPanel").style.display="none";
  document.getElementById("loginPage").style.display="flex";

  document.getElementById("password").value="";

}


/* QR */

document.getElementById("qrFile")
.addEventListener("change",function(){

  const file=this.files[0];

  if(!file)return;

  const reader=new FileReader();

  reader.onload=function(e){

    document.getElementById("qrPreview").src=e.target.result;
    document.getElementById("qrPreview").style.display="block";

  };

  reader.readAsDataURL(file);

});


function saveQR(){

  const image =
    document.getElementById("qrPreview").src;

  if(!image){

    alert("Please select QR image first.");
    return;

  }

  localStorage.setItem("ff_qr",image);

  document.getElementById("qrStatus").innerText =
    "QR Code saved successfully.";

}


/* TOURNAMENT */

function saveTournament(){

  const data={

    oneEntry:document.getElementById("oneEntry").value,
    onePrize:document.getElementById("onePrize").value,

    twoEntry:document.getElementById("twoEntry").value,
    twoPrize:document.getElementById("twoPrize").value,

    squadEntry:document.getElementById("squadEntry").value,
    squadPrize:document.getElementById("squadPrize").value

  };

  localStorage.setItem(
    "ff_tournament",
    JSON.stringify(data)
  );

  document.getElementById("tournamentStatus").innerText =
    "Tournament settings saved.";

}


/* NOTICE */

function saveNotice(){

  const value =
    document.getElementById("notice").value;

  localStorage.setItem("ff_notice",value);

  document.getElementById("noticeStatus").innerText =
    "Notice saved.";

}


/* CONTACT */

function saveContacts(){

  const data={

    whatsapp:document.getElementById("whatsapp").value,
    telegram:document.getElementById("telegram").value

  };

  localStorage.setItem(
    "ff_contacts",
    JSON.stringify(data)
  );

  document.getElementById("contactStatus").innerText =
    "Contact links saved.";

}


/* PLAYERS */

function addPlayer(){

  const name =
    document.getElementById("playerName").value;

  const uid =
    document.getElementById("playerUid").value;

  const mode =
    document.getElementById("playerMode").value;

  if(!name || !uid){

    alert("Player name and UID required.");
    return;

  }

  let players =
    JSON.parse(localStorage.getItem("ff_players") || "[]");

  players.push({
    name:name,
    uid:uid,
    mode:mode
  });

  localStorage.setItem(
    "ff_players",
    JSON.stringify(players)
  );

  document.getElementById("playerName").value="";
  document.getElementById("playerUid").value="";

  showPlayers();

}


function showPlayers(){

  const box =
    document.getElementById("players");

  const players =
    JSON.parse(localStorage.getItem("ff_players") || "[]");

  box.innerHTML="";

  players.forEach((p,index)=>{

    const div=document.createElement("div");

    div.style.marginTop="12px";
    div.style.padding="12px";
    div.style.background="#242430";
    div.style.borderRadius="10px";

    div.innerHTML=`
      <b>${p.name}</b><br>
      UID: ${p.uid}<br>
      Mode: ${p.mode}
      <button class="delete"
        onclick="deletePlayer(${index})">
        Delete
      </button>
    `;

    box.appendChild(div);

  });

}


function deletePlayer(index){

  let players =
    JSON.parse(localStorage.getItem("ff_players") || "[]");

  players.splice(index,1);

  localStorage.setItem(
    "ff_players",
    JSON.stringify(players)
  );

  showPlayers();

}


/* WINNER */

function saveWinner(){

  const winner =
    document.getElementById("winner").value;

  localStorage.setItem("ff_winner",winner);

  document.getElementById("winnerStatus").innerText =
    "Winner published.";

}


/* LOAD */

function loadData(){

  const qr=localStorage.getItem("ff_qr");

  if(qr){

    document.getElementById("qrPreview").src=qr;
    document.getElementById("qrPreview").style.display="block";

  }


  const tournament =
    JSON.parse(
      localStorage.getItem("ff_tournament") || "null"
    );

  if(tournament){

    document.getElementById("oneEntry").value=tournament.oneEntry;
    document.getElementById("onePrize").value=tournament.onePrize;

    document.getElementById("twoEntry").value=tournament.twoEntry;
    document.getElementById("twoPrize").value=tournament.twoPrize;

    document.getElementById("squadEntry").value=tournament.squadEntry;
    document.getElementById("squadPrize").value=tournament.squadPrize;

  }


  document.getElementById("notice").value =
    localStorage.getItem("ff_notice") || "";


  const contacts =
    JSON.parse(
      localStorage.getItem("ff_contacts") || "null"
    );

  if(contacts){

    document.getElementById("whatsapp").value =
      contacts.whatsapp || "";

    document.getElementById("telegram").value =
      contacts.telegram || "";

  }


  document.getElementById("winner").value =
    localStorage.getItem("ff_winner") || "";

  showPlayers();

}

</script>

</body>
  </html>
