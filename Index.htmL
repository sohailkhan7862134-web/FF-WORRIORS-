<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FF WARRIORS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0b0b;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 25px 15px;
      text-align: center;
      background: #151515;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
      color: #ffb000;
    }

    header p {
      color: #aaa;
    }

    .container {
      padding: 20px;
    }

    .card {
      background: #181818;
      border: 1px solid #292929;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 15px;
    }

    .card h2 {
      margin-top: 0;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #ffb000;
      color: #111;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header>
    <h1>🔥 FF WARRIORS</h1>
    <p>Free Fire Tournament</p>
  </header>

  <div class="container">

    <div class="card">
      <h2>🏆 Welcome Warriors</h2>
      <p>Join exciting Free Fire tournaments.</p>
    </div>

    <div class="card">
      <h2>🎮 Upcoming Tournament</h2>
      <p>1v1 Battle</p>
      <p>Registration coming soon.</p>

      <button onclick="alert('FF WARRIORS is working!')">
        TEST APP
      </button>
    </div>

  </div>

</body>
</html>
