<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#0b0b0f;
  color:white;
  padding-bottom:75px;
}

header{
  padding:20px;
  text-align:center;
  background:linear-gradient(135deg,#171722,#101014);
  border-bottom:1px solid #292936;
}

.logo{
  font-size:28px;
  font-weight:bold;
  letter-spacing:2px;
}

.logo span{
  color:#ffb000;
}

.subtitle{
  margin-top:6px;
  color:#aaa;
  font-size:13px;
}

.container{
  padding:18px;
}

.section-title{
  font-size:20px;
  margin:8px 0 14px;
}

.banner{
  background:linear-gradient(135deg,#ffb000,#ff6a00);
  color:#111;
  border-radius:18px;
  padding:20px;
  margin-bottom:22px;
}

.banner h2{
  font-size:23px;
}

.banner p{
  margin-top:8px;
  font-size:14px;
}

.card{
  background:#15151d;
  border:1px solid #292936;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
}

.card h3{
  margin-bottom:9px;
}

.info{
  color:#aaa;
  font-size:14px;
  line-height:1.6;
}

.badge{
  display:inline-block;
  background:#252531;
  color:#ffb000;
  padding:6px 10px;
  border-radius:8px;
  font-size:12px;
  margin-bottom:10px;
}

.btn{
  border:0;
  background:#ffb000;
  color:#111;
  padding:11px 15px;
  border-radius:10px;
  font-weight:bold;
  margin-top:12px;
  width:100%;
  cursor:pointer;
}

.social{
  display:flex;
  gap:10px;
  margin-top:10px;
}

.social a{
  flex:1;
  text-decoration:none;
  text-align:center;
  padding:12px;
  border-radius:10px;
  background:#252531;
  color:white;
  font-weight:bold;
}

.page{
  display:none;
}

.page.active{
  display:block;
}
