<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FF WARRIORS</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- TOP HEADER -->
  <header class="header">

    <div class="logo">
      FF <span>WARRIORS</span>
    </div>

    <div class="top-buttons">
      <button onclick="openInstagram()">Instagram</button>
      <button onclick="openYouTube()">YouTube</button>
      <button onclick="openWallet()">👛 Wallet</button>
    </div>

  </header>


  <!-- HOME -->
  <main id="home">

    <h1>Choose Tournament</h1>
    <p class="subtitle">
      Select a tournament category
    </p>


    <!-- TOURNAMENT BOXES -->
    <div class="tournament-grid">

      <div class="tournament-box"
           onclick="openTournament('FULL MAP')">
        <div class="box-icon">🎮</div>
        <h2>FULL MAP</h2>
        <p>Full Map Tournaments</p>
      </div>


      <div class="tournament-box"
           onclick="openTournament('LONWOLF 1 VS 1')">
        <div class="box-icon">🐺</div>
        <h2>LONWOLF</h2>
        <p>1 VS 1</p>
      </div>


      <div class="tournament-box"
           onclick="openTournament('CLASH SQUAD 2 VS 2')">
        <div class="box-icon">⚔️</div>
        <h2>CLASH SQUAD</h2>
        <p>2 VS 2</p>
      </div>


      <div class="tournament-box"
           onclick="openTournament('LONWOLF 2 VS 2')">
        <div class="box-icon">🐺</div>
        <h2>LONWOLF</h2>
        <p>2 VS 2</p>
      </div>


      <div class="tournament-box coming-soon">
        <div class="box-icon">🏆</div>
        <h2>COMING SOON</h2>
        <p>More tournaments</p>
      </div>


      <div class="tournament-box coming-soon">
        <div class="box-icon">🔥</div>
        <h2>COMING SOON</h2>
        <p>More tournaments</p>
      </div>

    </div>

  </main>


  <!-- TOURNAMENT DETAILS -->
  <section id="tournamentPage" class="page hidden">

    <button class="back-button" onclick="goHome()">
      ← Back
    </button>

    <h1 id="tournamentTitle"></h1>

    <div id="tournamentList"></div>

  </section>


  <!-- WALLET -->
  <section id="walletPage" class="page hidden">

    <button class="back-button" onclick="goHome()">
      ← Back
    </button>

    <h1>👛 Wallet</h1>

    <div class="wallet-card">

      <h2>₹0.00</h2>

      <p>Wallet Balance</p>

      <button class="wallet-option">
        💰 Deposit
      </button>

      <button class="wallet-option">
        💸 Withdrawal
      </button>

      <button class="wallet-option">
        📜 Transaction History
      </button>

    </div>

  </section>


  <script src="app.js"></script>

</body>
  </html>
